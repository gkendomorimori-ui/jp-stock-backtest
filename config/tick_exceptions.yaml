# Dated, per-stock changes of the tick-size table (TSE market news "○月○日以降の呼値の単位の
# 取扱いについて"). This reproduces the exchange's rules; it is NOT a strategy setting.
#
# How it is applied (src/backtest/ticks.py):
#   * Default: the fine table applies when the day's J-Quants ScaleCat is in the fine set of the
#     regime in force (TOPIX100 before 2023-06-05, TOPIX500 from 2023-06-05).
#   * An entry below overrides that from its effective date (inclusive) until the next entry
#     for the same code, or until the end of the regime in which it took effect (a TOPIX100-era
#     entry never applies from 2023-06-05, when every TOPIX500 stock got the fine table).
#   * action: fine = the fine table newly applies; standard = the fine table no longer applies.
#
# Every entry was read on the jpx.co.jp notice page itself (2026-09-29).
# Coverage: 2025-01 .. 2026-09 checked month by month in the JPX news archive. 2021-06 .. 2024-12
# comes from searches: the October periodic replacements are all present, but individual
# (TOB / delisting / listing) notices of that time may be missing. Unresolved: 8729 Sony
# Financial Group (listed 2025-09-29) -- no notice found.
# The 2023-06-05 extension to TOPIX Mid400 is the regime change itself (ticks.REGIMES), not an
# entry here (https://www.jpx.co.jp/news/1030/20230526-01.html, 20230602-01.html).

source_checked: 2026-09-29
