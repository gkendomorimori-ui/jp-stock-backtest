# Target market / symbols.
# The universe is built point-in-time: on each signal day T only securities that are
# listed on T (per /v2/equities/master?date=T) and pass the filters below are eligible.

universe:
  name: tse_all_markets_liquid_100m

  mode: market                 # use all securities in `markets`, then apply `filters`

  # J-Quants market codes (Mkt). Verified against the J-Quants spec on 2026-09-27.
  # The Prime/Standard/Growth segments only exist from 2022-04-04, so the legacy
  # segments are included for dates before that.
  markets:
    current:
      - {code: "0111", name: プライム}
      - {code: "0112", name: スタンダード}
      - {code: "0113", name: グロース}
    legacy:                    # before 2022-04-04
      - {code: "0101", name: 東証一部}
      - {code: "0102", name: 東証二部}
      - {code: "0104", name: マザーズ}
      - {code: "0106", name: JASDAQ スタンダード}
      - {code: "0107", name: JASDAQ グロース}
    excluded:                  # never included
      - {code: "0105", name: TOKYO PRO MARKET}
      - {code: "0109", name: その他}

  # Product category (J-Quants master field `ProdCat`, verified against the spec 2026-09-27).
  # Only 011 (domestic equities) can be common stock. 011 ALSO contains preferred
  # securities, so ProdCat alone cannot isolate common stock (see docs/DATA_SOURCES.md).
  product_category:
    include: ["011"]           # domestic equities
    exclude:
      - {code: "012", name: 優先出資証券}
      - {code: "013", name: REIT}
      - {code: "014", name: ETF}
      - {code: "021", name: 外国株式}
      - {code: "022", name: 外国REIT}
      - {code: "023", name: 外国ETF}
      - {code: "024", name: 外国預託証券}
  # Common stock rule (decided 2026-09-27, docs/DATA_SOURCES.md):
  #   ProdCat == "011" AND the 5th digit of the 5-digit code == "0".
  # JPX code rules: common stock has no suffix; preferred shares use 5/6, other share
  # classes 1-4/7-9. Verified on the 2026-06-01 master (6 non-"0" rows, all preferred).
  common_stock_code_suffix: "0"
  # Anything that cannot be positively classified as common stock is NOT included.
  unclassified_policy: exclude

  index: null                  # unused (mode == market)
  symbols: []                  # unused (mode == market)

  filters:
    min_price: null            # no price filter
    # Liquidity: average daily turnover (J-Quants field `Va`, unadjusted JPY value) over the
    # 20 trading days T-20 .. T-1 (excluding signal day T) must be >= 100,000,000 JPY.
    min_avg_turnover: 100000000
    turnover_window_days: 20
    turnover_window_includes_signal_day: false
    # New-entry data condition: the 20 exchange trading days T-20 .. T-1 are FIXED by the
    # exchange calendar (/v2/markets/calendar, HolDiv 1 or 2). Every one of them must have
    # valid OHLC, adjusted high/volume and turnover; T itself must have valid AdjC/AdjVo.
    # Missing days are NOT skipped/back-filled with older data. This filter applies to new
    # entries only; it never removes or force-closes an existing position.
    min_history_days: 20
    history_window: fixed_exchange_calendar
    exclude_symbols: []

  survivorship:
    # J-Quants returns delisted securities for dates when they were listed, so delisted
    # securities are included. TODO: confirm with a KNOWN delisted security at the
    # connection check. If impossible, set false and state the limitation in README.md.
    include_delisted: true

# Benchmark is defined in config/backtest.yaml (TOPIX price index).
