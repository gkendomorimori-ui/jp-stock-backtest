# Common backtest settings (applies to every strategy unless its spec overrides it).
# Values marked "TODO" are NOT decided yet. Everything else is decided (2026-09-27).

capital:
  initial_capital: 1500000     # JPY

costs:
  commission:
    model: rate                # fraction of traded value, applied to every buy and every sell
    rate: 0.0005               # 0.05% of traded value
    fixed: null                # unused (model == rate)
    minimum: 0                 # no minimum commission
  slippage:
    model: rate                # adverse move: buy fills higher, sell fills lower
    rate: 0.001                # 0.10% per side (entry and exit separately)
    ticks: null                # unused (model == rate)

period:
  # TODO: fix after data is downloaded (J-Quants Light plan or above is needed for 5 years).
  # A 20-trading-day warm-up must exist BEFORE start_date (signals need 20 prior days).
  start_date: null             # TODO: YYYY-MM-DD
  end_date: null               # TODO: YYYY-MM-DD
  preset: 5y                   # intended length: past 5 years of daily data

position:
  maximum_positions: 5         # max concurrent positions (all strategies)
  lot_size: 100                # trading unit (shares)
  long_only: true              # cash (spot) buys only; no short selling, no margin

execution:
  signal_timing: close_of_day_t   # fixed rule (docs/BACKTEST_RULES.md)
  execution_lag_days: 1           # fixed rule: orders created at T close execute from T+1
  execution_price: open           # default entry price: T+1 open (strategy spec may define exits)

evaluation:
  trading_days_per_year: 252
  risk_free_rate: 0.0

reproducibility:
  random_seed: null            # no randomness used so far

output:
  results_dir: results/runs
