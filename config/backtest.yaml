# Common backtest settings (applies to every strategy unless its spec overrides it).
# Values marked "TODO" are NOT decided yet. Everything else is decided (2026-09-27).

capital:
  initial_capital: 1500000     # JPY

costs:
  commission:
    model: rate                # fraction of traded value, applied to every buy and every sell
    rate: 0.0005               # 0.05% of traded value
    fixed: null                # unused (model == rate)
    minimum: 0                 # no minimum commission
  slippage:
    model: rate                # adverse move: buy fills higher, sell fills lower
    rate: 0.001                # 0.10% per side (entry and exit separately)
    ticks: null                # unused (model == rate)

period:
  # Decided 2026-09-29 (docs/EVALUATION_PLAN.md, option 1), BEFORE looking at any result
  # on these periods. All dates are INCLUSIVE and are exchange trading days.
  # Trading-day counts: computed with the JPX holiday rules and cross-checked against the
  # Light-plan calendar total (1,221 days); re-verify with scripts/check_periods.py.
  data_start: 2021-09-29       # first date the Light plan returned (2026-09-29)
  data_end: 2026-09-28
  warmup_trading_days: 20      # indicators only, immediately before each segment start

  # start_date / end_date = the period used by default for runs (development only).
  start_date: 2021-10-27
  end_date: 2024-04-02
  preset: null

  # Each segment starts with initial_capital, no positions and no carried-over orders.
  # The first signal is judged at the close of the segment's first day.
  split:
    initial_warmup:            # indicators only; no trading, no results
      start_date: 2021-09-29
      end_date: 2021-10-26
      trading_days: 20
      status: warmup
    development:               # baseline check + pre-registered sensitivity analyses
      start_date: 2021-10-27
      end_date: 2024-04-02
      trading_days: 595
      status: open
    final_evaluation:          # NOT viewed. Do not compute/show results until frozen
      start_date: 2024-04-03
      end_date: 2026-04-02
      trading_days: 488
      status: sealed
    viewed_reference:          # smoke test already viewed; reference only, never merged
      start_date: 2026-04-03
      end_date: 2026-07-03
      trading_days: 62
      status: viewed
    holdout:                   # extra check after the final evaluation; NOT viewed
      start_date: 2026-07-06
      end_date: 2026-09-28
      trading_days: 56
      status: sealed
    # The 20 trading days before each segment start may be used for indicators only.
    indicator_only_days_before_final: 20

run:
  # smoke_test | development | final_evaluation
  # Free-plan / small-data runs are smoke_test and must not be used as evaluation results.
  run_type: smoke_test

position:
  maximum_positions: 5         # max concurrent positions (all strategies)
  lot_size: 100                # trading unit (shares)
  long_only: true              # cash (spot) buys only; no short selling, no margin

execution:
  signal_timing: close_of_day_t   # fixed rule (docs/BACKTEST_RULES.md)
  execution_lag_days: 1           # fixed rule: orders created at T close execute from T+1
  execution_price: open           # default entry price: T+1 open (strategy spec may define exits)
  # Execution model (docs/EXECUTION_MODEL.md). v2 = base model from 2026-09-29: point-in-time
  # tick rounding of intraday exits, limit-up / limit-down non-fills, persistent sell
  # requests. v1 = previous model, kept only for the diagnostic comparison
  # (scripts/run_backtest.py --execution-model v1).
  model_version: v2

evaluation:
  trading_days_per_year: 252
  risk_free_rate: 0.0
  dividends_included: false    # initial version: price and costs only, no dividends

benchmark:
  name: TOPIX                  # price index (NOT dividend-inclusive)
  source: jquants_topix        # /v2/indices/bars/daily/topix, field C (Light plan or above)
  dividends_included: false
  normalize_to_start: true     # rebased to initial_capital on the first day of the same period

reproducibility:
  random_seed: null            # no randomness used so far

output:
  results_dir: results/runs
